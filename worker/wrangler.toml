name = "automations"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# The dashboard SPA is served from the same Worker as the API, so there is one
# deploy and no CORS.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# The dispatcher wakes every minute and starts whatever is due. Handlers are
# expected to be short; anything long-running should chunk itself across runs.
[triggers]
crons = ["* * * * *"]

[vars]
# Non-secret config. Secrets are set with `wrangler secret put` -- see README.
SUPABASE_URL = ""
SUPABASE_ANON_KEY = ""
OWNER_EMAIL = ""
